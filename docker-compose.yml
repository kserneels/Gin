services:
  ginlog:
    build: .
    ports:
      - "${HOST_PORT:-8091}:8080"
    environment:
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
    volumes:
      - ginlog-data:/data
    restart: unless-stopped

volumes:
  ginlog-data:
